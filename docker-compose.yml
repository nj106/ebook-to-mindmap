# Portainer production compose for ebook-to-mindmap.
# Stateless frontend (user data lives in browser localStorage); no volumes.
# Image built by .github/workflows/build-image.yml -> ghcr.io/nj106/ebook-to-mindmap:latest
services:
  ebook-to-mindmap:
    image: ghcr.io/nj106/ebook-to-mindmap:latest
    container_name: ebook-to-mindmap
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "8095:80"
    labels:
      - com.centurylinklabs.watchtower.enable=true
